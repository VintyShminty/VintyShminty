packages:
  - apps/*
  - packages/*
# New package versions must be at least 7 days old (in minutes). RULE: see docs/playbook/security-and-safety.md
minimumReleaseAge: 10080
# Expo SDK 57 patch versions that expo-doctor requires, newer than 7 days.
# Remove each line once the version is 7 days old: the Oct 12 releases on 2026-10-19, the Oct 6 releases on 2026-10-13.
# Check with: npm view <package> time --json
minimumReleaseAgeExclude:
  - '@expo/ui@57.0.23'
  - expo@57.0.28
  - expo-router@57.0.26
  - expo-splash-screen@57.0.10
  - expo-constants@57.0.21
  - expo-image-manipulator@57.0.21
  - expo-linking@57.0.12
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - '@expo/cli@57.0.29'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/fingerprint@0.20.14'
  - '@expo/image-utils@0.11.6'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.18'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.15
  - expo-asset@57.0.19
# Only packages that must run an install script. esbuild downloads its native binary.
allowBuilds:
  esbuild: true
nodeLinker: hoisted
# Security fixes for packages we only get through other packages (added 2026-11-17).
# Each rule only touches the unsafe versions, so it stops doing anything once the parent package moves on.
overrides:
  # Expo's command line tool before 57.0.33 brings zod 3, which has no fixed release (GHSA-mrhx-c7xc-m3w5).
  # 57.0.33 drops zod and is inside the range expo 57 already asks for.
  '@expo/cli@<57.0.33': ^57.0.33
  # better-call (inside Better Auth) still resolves an old zod 4 (GHSA-mrhx-c7xc-m3w5).
  'zod@>=4.0.0 <4.6.6': ^4.6.6
  # Used by Expo's command line tool for code signing (seven advisories, fixed in 1.4.1).
  'node-forge@<1.4.1': ^1.4.1
# Accepted audit findings. Each entry needs a reason and a recheck date (docs/playbook/security-and-safety.md).
# GHSA-vfj7-8cjw-p6xm (braces, high): only reached through Expo's build tooling on the developer machine
# (Metro file map), never shipped in the app. No patched release exists on npm as of 2026-10-12.
# Recheck weekly and remove once a patched version is out.
# GHSA-qr28-fpjm-wq7f (decode-uri-component, high, slow-down on a crafted address): reached only through
# expo-router 57, which uses query-string 7, which needs decode-uri-component 0.2. The only fixed release (0.5.1)
# is a rewrite that query-string 7 cannot load, so forcing it would break links in the app. expo-router 58
# (Expo SDK 58) no longer uses query-string. Recheck 2026-12-01 and remove with the SDK 58 upgrade.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-qr28-fpjm-wq7f
# Transitive dependencies may not come from git or tarball links, only from the registry.
blockExoticSubdeps: true
