<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VintyShminty component sheet</title>
<style>
@font-face{font-family:Aileron;font-weight:300;src:url(https://cdn.jsdelivr.net/npm/@fontsource/aileron@5.3.0/files/aileron-latin-300-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Aileron;font-weight:400;src:url(https://cdn.jsdelivr.net/npm/@fontsource/aileron@5.3.0/files/aileron-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Aileron;font-weight:600;src:url(https://cdn.jsdelivr.net/npm/@fontsource/aileron@5.3.0/files/aileron-latin-600-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Aileron;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/@fontsource/aileron@5.3.0/files/aileron-latin-700-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Aileron;font-weight:800;src:url(https://cdn.jsdelivr.net/npm/@fontsource/aileron@5.3.0/files/aileron-latin-800-normal.woff2) format("woff2");font-display:swap}
:root{
--font:Aileron,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
--background:#FFFFFF;--surface:#FBF8F2;--pressed:#F1E9DA;--border:#E4DACA;--border-subtle:#F0EADF;
--text-1:#241811;--text-2:#54443A;--text-3:#695A4F;--text-4:#7A6B60;
--accent:#4B2E22;--on-accent:#FFFFFF;--accent-tint:#F7EEDC;--chip-selected:#EFE0C3;--on-chip:#3A2218;
--success:#1B7A43;--success-tint:#E6F4EA;--warning:#8A4F00;--warning-tint:#FFEFC2;--error:#B3261E;--error-tint:#FDECEA;--destructive:#B3261E;
--window:rgba(255,255,255,.96);--backdrop:rgba(36,24,17,.25);
--r-btn:12px;--r-win:20px;--r-search:32px;--r-pill:999px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--surface);color:var(--text-1);font-family:var(--font);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font-family:inherit;color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}.ic.fill{fill:currentColor}
/* shell */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--background);border-right:1px solid var(--border);padding:20px 16px 32px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:18px}.brand small{display:block;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-top:2px}
.sfilter{display:flex;align-items:center;gap:8px;margin:16px 0 8px;height:40px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-pill);padding:0 14px;color:var(--text-3)}
.sfilter input{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--text-1)}
.sfilter:focus-within{border-color:var(--text-3)}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-radius:var(--r-btn);color:var(--text-2);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--surface)}.nav a.on{background:var(--pressed);color:var(--text-1);font-weight:600}
.nav .later{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4)}
.nav h6{margin:20px 12px 6px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);display:flex;justify-content:space-between}
.nonav{padding:12px;color:var(--text-3);font-size:14px}
.top{display:none}
.main{min-width:0;padding:40px 40px 96px}
.page{max-width:1040px;margin:0 auto}
@media(max-width:860px){
.app{display:block}
.side{display:none;position:fixed;inset:56px 0 0 0;z-index:30;height:auto;border-right:0;padding:12px 16px 40px}
body.menu .side{display:block}
.top{display:flex;position:sticky;top:0;z-index:40;height:56px;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--background);border-bottom:1px solid var(--border)}
.top button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-pill);font-size:13px;font-weight:600;cursor:pointer}
.main{padding:24px 16px 80px}
}
/* story chrome */
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
h1.sname{font-size:40px;line-height:1;letter-spacing:-.035em;font-weight:300;margin:6px 0 12px}h1.sname b{font-weight:800}
.purpose{font-size:16px;color:var(--text-2);max-width:680px;margin:0 0 16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--border);color:var(--text-2);background:var(--background)}
.tag.src-R{background:var(--accent-tint);color:var(--accent);border-color:var(--accent-tint)}
.tag.src-G{background:var(--chip-selected);color:var(--on-chip);border-color:var(--chip-selected)}
.tag.src-X{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tag.src-B{background:var(--pressed);color:var(--text-1);border-color:var(--pressed)}
.facts{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 16px;border:1px solid var(--border);background:var(--background);border-radius:var(--r-win);padding:16px 20px;margin:0 0 32px;font-size:14px}
.facts dt{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding-top:3px}.facts dd{margin:0;color:var(--text-2)}
@media(max-width:560px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:10px}h1.sname{font-size:32px}}
h2.sh{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin:32px 0 12px;display:flex;align-items:center;gap:12px}
h2.sh:after{content:"";flex:1;height:1px;background:var(--border-subtle)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--min,260px),100%),1fr));gap:12px}
.cell{min-width:0;background:var(--background);border:1px solid var(--border-subtle);border-radius:var(--r-win);overflow:hidden}
.cl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding:10px 14px 0}
.cb{padding:12px 14px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cb.col{flex-direction:column;align-items:stretch}.cb.flush{padding:0}.cb.tint{background:var(--surface)}
.mx{border:1px solid var(--border-subtle);background:var(--background);border-radius:var(--r-win);overflow:hidden}
.mx .row{display:flex;flex-wrap:wrap;gap:16px 20px;padding:14px;border-top:1px solid var(--border-subtle);align-items:flex-end}.mx .row:first-child{border-top:0}
.mx .rl{flex:0 0 100%;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.mx .it{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.mx .it i{font-style:normal;font-size:11px;color:var(--text-3)}
.phone{width:min(390px,100%);background:var(--background);border:1px solid var(--border);border-radius:28px;overflow:hidden;position:relative;font-size:14px;display:flex;flex-direction:column}
.phone.scroll{max-height:760px}
.pb{flex:1;min-height:0;overflow:hidden;position:relative}
.pb[style*=height]{flex:none}
.phones{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pcap{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin:0 0 8px}
.pwrap{flex:0 1 390px;width:390px;min-width:0;max-width:100%}
.dim{position:absolute;inset:0;background:var(--backdrop)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--window);border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:0;border-top-color:var(--background);padding:8px 16px 28px}
.sheet .grab{width:36px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 8px}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;height:44px;font-size:18px;font-weight:700}
.sheet .sh-h .mid{flex:1;text-align:center}
.note{font-size:13px;color:var(--text-3);margin:8px 0 0}
/* type styles */
.t-display{font-size:40px;line-height:.96;font-weight:300;letter-spacing:-.035em}.t-display b{font-weight:800}
.t-title{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.t-subtitle{font-size:14px;font-weight:400;color:var(--text-2)}
.t-itemname{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.t-heading{font-size:18px;font-weight:700}
.t-section{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.t-label{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.t-cardtitle{font-size:13px;font-weight:500}
.t-cardsub{font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.03em;color:var(--text-3)}
.t-pill{font-size:13px;font-weight:500}
.t-badge{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.t-body{font-size:16px;font-weight:400}
.t-bodys{font-size:14px;font-weight:400}
/* button */
.k-btn{height:48px;padding:0 20px;border-radius:var(--r-btn);font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,opacity .15s}
.k-btn.md{height:40px;padding:0 16px;font-size:14px}.k-btn.sm{height:32px;padding:0 12px;font-size:13px}.k-btn.full{width:100%}
.k-btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.k-btn.outline{background:transparent;color:var(--accent);border-color:var(--accent)}
.k-btn.ghost{background:transparent;color:var(--text-2);border-color:var(--border)}
.k-btn.destructive{background:var(--destructive);color:var(--on-accent);border-color:var(--destructive)}
.k-btn.primary:active,.k-btn.primary.is-pressed,.k-btn.destructive:active,.k-btn.destructive.is-pressed{opacity:.85}
.k-btn.outline:active,.k-btn.outline.is-pressed{background:var(--pressed)}
.k-btn.ghost:active,.k-btn.ghost.is-pressed{border-color:var(--text-3);color:var(--text-1);background:var(--surface)}
.k-btn:disabled{opacity:.4;cursor:not-allowed}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp 1s linear infinite;display:inline-block;flex:none}
.spin.sz20{width:20px;height:20px}.spin.sz32{width:32px;height:32px;border-width:3px}.spin.acc{color:var(--accent)}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.5}}
/* icon button */
.k-ib{width:40px;height:40px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--text-1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.k-ib.sm{width:32px;height:32px}.k-ib:active,.k-ib.is-pressed{background:var(--pressed)}.k-ib:disabled{opacity:.4}
.k-ib.float{background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.6)}
.k-ib.sq{border-radius:var(--r-btn);border-color:var(--border)}
.k-circ{display:inline-flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-1);background:none;border:0;cursor:pointer}
.k-circ i{width:60px;height:60px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-style:normal}
.k-circ:active i,.k-circ.is-pressed i{background:var(--pressed)}.k-circ:disabled{opacity:.4}
/* text field */
.k-f{display:block;width:100%}.k-f label{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.k-in{height:48px;border:1px solid var(--border);border-radius:var(--r-btn);padding:0 14px;display:flex;align-items:center;gap:8px;font-size:16px;background:var(--background);color:var(--text-1)}
.k-in span.ph-t{color:var(--text-4)}.k-in.focus{border-color:var(--accent);box-shadow:none;outline:1px solid var(--accent);outline-offset:-2px}
.k-in.multi{height:104px;align-items:flex-start;padding-top:12px}.k-in.dis{background:var(--surface);color:var(--text-4)}
.k-in .pre{color:var(--text-3)}.k-in .grow{flex:1;min-width:0}.k-in svg{color:var(--text-3)}
.k-f.err .k-in{border-color:var(--error)}.k-f small{display:block;font-size:12px;margin-top:4px;color:var(--text-3)}.k-f.err small{color:var(--error)}
/* checkbox radio switch */
.k-cb,.k-rd{width:22px;height:22px;border:1.5px solid var(--text-3);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--background);color:var(--on-accent);flex:none;cursor:pointer}
.k-rd{border-radius:50%}.k-cb.on{background:var(--accent);border-color:var(--accent)}.k-rd.on{border-color:var(--accent)}.k-rd.on:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.k-cb svg{display:none}.k-cb.on svg{display:block}.dis-x{opacity:.4;pointer-events:none}
.k-sw{width:48px;height:28px;border-radius:var(--r-pill);background:var(--pressed);border:1px solid var(--border);position:relative;display:block;cursor:pointer;flex:none;transition:background .15s}
.k-sw:after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--background);border:1px solid var(--border);transition:left .15s}
.k-sw.on{background:var(--accent);border-color:var(--accent)}.k-sw.on:after{left:22px;border-color:transparent}
.k-lr{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 0;font-size:15px;border-bottom:1px solid var(--border-subtle)}
.k-lr:last-child{border-bottom:0}
/* chips badges avatar */
.k-chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--r-pill);font-size:13px;font-weight:500;background:var(--background);color:var(--text-1);border:1px solid var(--text-4);white-space:nowrap;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.k-chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.k-chip.ap{background:var(--background);color:var(--accent);border:1.5px solid var(--accent);font-weight:600}
.k-chip.is-pressed,.k-chip:active{background:var(--pressed)}.k-chip.on.is-pressed,.k-chip.on:active{background:var(--accent);opacity:.85}
.k-chip.dis{opacity:.4;pointer-events:none}
.k-chip .n{font-weight:400;color:inherit;opacity:.85}.k-chip .x{display:inline-flex;margin-right:-4px;margin-left:2px}.k-chip .x svg{stroke-width:2.2}
.k-fbtn{flex:none;width:40px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill);border:1px solid var(--text-4);background:var(--background);color:var(--accent);cursor:pointer}
.k-fbtn.is-pressed,.k-fbtn:active{background:var(--pressed)}.k-fbtn.dis{opacity:.4;pointer-events:none}
.k-bdg{display:inline-flex;height:22px;align-items:center;gap:4px;padding:0 9px 0 7px;border-radius:var(--r-pill);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:var(--background);border:1px solid currentColor}
.k-bdg svg{stroke-width:2}
.k-bdg.sold,.k-bdg.ok{color:var(--success)}.k-bdg.tint{color:var(--accent)}.k-bdg.warn{color:var(--warning)}.k-bdg.err{color:var(--error)}.k-bdg.out{color:var(--text-2)}
.bph{width:100%;aspect-ratio:3/3.4;border-radius:0;border:0}.bpos{position:absolute;left:8px;top:8px;z-index:2}
.k-av{width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:var(--accent-tint);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--s,40px)*.4);position:relative;flex:none;border:1px solid var(--border-subtle);overflow:hidden}
.k-av img{width:100%;height:100%;object-fit:cover}
.k-av.sil{background:var(--pressed);color:var(--text-3)}
.k-av .vt{position:absolute;right:-2px;bottom:-2px;width:40%;height:40%;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--background)}
.avw{position:relative;display:inline-flex}
.stack .k-av{margin-left:-10px;border:2px solid var(--background)}.stack .k-av:first-child{margin-left:0}
/* tabs */
.k-tabs{display:flex;width:100%;border-bottom:1px solid var(--border-subtle)}
.k-tab{flex:1;text-align:center;padding:12px 4px;font-size:14px;font-weight:600;color:var(--text-3);border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;margin-bottom:-1px}
.k-tab.on{color:var(--text-1);border-bottom-color:var(--accent)}.k-tab.is-pressed,.k-tab:active{background:var(--surface)}
/* list row */
.k-lrow{display:flex;align-items:center;gap:14px;min-height:54px;padding:8px 16px;border-bottom:1px solid var(--border-subtle);background:var(--background);width:100%;font-size:15px;text-align:left;border-left:0;border-right:0;border-top:0;cursor:pointer}
.k-lrow .lb{flex:1;min-width:0;font-weight:600}.k-lrow .vl{color:var(--text-3);font-size:14px}.k-lrow .lead{color:var(--accent)}.k-lrow .ch{color:var(--text-4)}
.k-lrow:active,.k-lrow.is-pressed{background:var(--surface)}.k-lrow.dis{opacity:.4}.k-lrow.destr .lb,.k-lrow.destr .lead{color:var(--destructive)}
.band{height:24px;background:var(--surface);border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
.k-sec{display:flex;justify-content:space-between;align-items:baseline;padding:20px 16px 8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.k-sec a,.k-link{color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.k-link.plain{color:var(--text-2);text-decoration:none}.k-link:active,.k-link.is-pressed{opacity:.55}
.k-top{display:flex;align-items:center;height:52px;padding:0 8px;background:var(--background);border-bottom:1px solid var(--border-subtle);width:100%}
.k-top .tt{flex:1;text-align:center;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.k-top .sd{min-width:40px;display:flex;justify-content:flex-end}.k-top .txt{font-size:14px;font-weight:600;color:var(--accent);padding:0 8px}
.k-top.over{position:absolute;left:0;right:0;top:0;background:transparent;border:0;z-index:2}
.k-stars{display:inline-flex;gap:1px;color:var(--accent)}.k-stars .half{position:relative;display:inline-flex}.k-stars .half .cut{position:absolute;inset:0;overflow:hidden;width:50%}
.k-stars .off{color:var(--border)}
.k-more{font-size:14px;color:var(--text-2);line-height:1.5}
/* skeleton */
.k-sk{background:var(--pressed);border-radius:8px;animation:pulse 1.2s ease-in-out infinite}
/* progress */
.k-pr{height:4px;border-radius:99px;background:var(--pressed);overflow:hidden;width:100%}.k-pr i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* dialog */
.k-dlg{background:var(--window);border:1px solid var(--border);border-top-color:var(--background);border-radius:var(--r-win);padding:20px;width:100%;max-width:320px;text-align:center}
.k-dlg h4{margin:0 0 6px;font-size:18px;font-weight:700}.k-dlg p{margin:0 0 16px;color:var(--text-2);font-size:14px}.k-dlg .acts{display:flex;flex-direction:column;gap:8px}
.k-menu{width:220px;background:var(--window);border:1px solid var(--border);border-radius:var(--r-btn);padding:4px;font-size:14px}
.k-menu div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer}.k-menu div:hover,.k-menu div.is-pressed{background:var(--pressed)}.k-menu .d{color:var(--destructive)}.k-menu hr{border:0;border-top:1px solid var(--border-subtle);margin:4px 0}
/* photo + cards */
.k-ph{position:relative;aspect-ratio:3/4;border-radius:var(--r-btn);overflow:hidden;background:var(--surface);border:1px solid var(--border-subtle)}
.k-ph.sq{aspect-ratio:1}.k-ph img{width:100%;height:100%;object-fit:cover;display:block}

const META=[{"id": "tokens", "name": "Tokens", "tier": "F", "src": "X", "desc": "The single place every colour, radius, spacing step and text style is named. Nothing else holds raw values.", "variants": "Colour (23 roles), radius (12 / 20 / 32 / full), spacing (4 to 40), type styles. Light only for now.", "screens": "Every screen", "phase": "First flows", "note": "Theme file read by NativeWind: colour, radius, spacing, type styles."}, {"id": "text", "name": "Text", "tier": "F", "src": "R:Text", "desc": "The one text component. Every piece of copy in the app uses a named style from the type scale.", "variants": "Styles: display (light plus heavy emphasis), title, subtitle, itemName, heading, sectionLabel, smallLabel, cardTitle, cardSubtitle, body, bodySmall. Colour steps: primary, secondary, muted, faint, accent, error.", "screens": "Every screen", "phase": "First flows", "note": ""}, {"id": "icon", "name": "Icon", "tier": "F", "src": "R:Icon", "desc": "A thin outline icon from one set (Lucide) that always takes the colour of its surroundings.", "variants": "Sizes: 13, 16, 20 (default), 24. Stroke 1.75. Filled only for the saved heart and star ratings.", "screens": "Every screen", "phase": "First flows", "note": "Lucide icons, drawn with the current text colour, never emoji."}, {"id": "screen", "name": "Screen", "tier": "F", "src": "X", "desc": "The page container. It handles the safe area, 16px side padding and clearance above the tab bar.", "variants": "With tab bar clearance, without tab bar (task pages), fixed header, scrolling or static body.", "screens": "Every screen", "phase": "First flows", "note": "Wraps Expo safe area. One scroll owner per screen."}, {"id": "separator", "name": "Separator", "tier": "F", "src": "R:Separator", "desc": "A thin line, or a wider pale band, that splits a page into sections.", "variants": "Hairline, band (24px pale gap between groups), inset (starts after the avatar).", "screens": "Item page, Settings, Profile menu, Balance, Inbox, Conversation thread", "phase": "First flows", "note": ""}, {"id": "photo", "name": "Photo", "tier": "F", "src": "X", "desc": "Shows a listing or profile picture cropped to fit, with initials or a placeholder when the picture fails to load.", "variants": "Ratios: 3:4 (cards), square (thumbnails), full width. States: loading (skeleton), loaded, failed (initials).", "screens": "Home feed, Search and results, Item page, Sell form, Inbox, My orders, Own profile", "phase": "First flows", "note": "Wraps Expo Image. Never tinted."}, {"id": "pressable", "name": "Pressable", "tier": "F", "src": "B", "desc": "Wraps anything tappable so it gives the same press feedback everywhere.", "variants": "Press styles: scale (cards), surface (rows), opacity (text links). 150ms.", "screens": "Every screen", "phase": "First flows", "note": "React Native Pressable plus a small press animation."}, {"id": "button", "name": "Button", "tier": "C", "src": "R:Button", "desc": "The main way to act. One component, four looks.", "variants": "Variants: primary, outline, ghost, destructive. Sizes: large 48, medium 40, small 32, full width. States: default, pressed, disabled, loading (spinner plus label). Optional leading icon.", "screens": "Item page, Sell form, Conversation thread, Own profile, Seller profile, Settings, Filter page", "phase": "First flows", "note": ""}, {"id": "iconbutton", "name": "IconButton", "tier": "C", "src": "X", "desc": "A round or square button that holds only an icon, such as back, close or more.", "variants": "Variants: plain, floating (glass chip over a photo), circle action (60px with a label underneath). Sizes 32, 40, 60. States: default, pressed, disabled.", "screens": "Item page, Conversation thread, Balance, Sell form, Search and results", "phase": "First flows", "note": "Composed from Pressable and Icon."}, {"id": "textfield", "name": "TextField", "tier": "C", "src": "R:Input", "desc": "A labelled box to type into, one line or several.", "variants": "Variants: single line, multiline, with prefix (currency), with trailing icon. States: default, focused, filled, error with message, disabled. Text 16px.", "screens": "Sell form, Filter page (price), Search and results, Conversation thread, Settings", "phase": "First flows", "note": "Reusables Input plus Label, with helper and error text added. Multiline uses Reusables Textarea."}, {"id": "checkbox", "name": "Checkbox", "tier": "C", "src": "R:Checkbox", "desc": "A square tick box for yes or no choices, and for picking several options from a list.", "variants": "States: off, on, disabled. With label row.", "screens": "Filter page (size, brand, condition), Sell form", "phase": "First flows", "note": ""}, {"id": "radio", "name": "Radio", "tier": "C", "src": "R:Radio Group", "desc": "A round dot for picking exactly one option from a list.", "variants": "States: off, on, disabled. With label row.", "screens": "Category picker (leaf rows), Filter page (sort), Sell form (parcel size)", "phase": "First flows", "note": ""}, {"id": "switch", "name": "Switch", "tier": "C", "src": "R:Switch", "desc": "A sliding on and off toggle for settings.", "variants": "States: off, on, disabled. With label row.", "screens": "Settings, Own profile (bundle discounts)", "phase": "First flows", "note": ""}, {"id": "chip", "name": "Chip", "tier": "C", "src": "X", "desc": "A small fully rounded outline pill used to filter and to switch views. The active chip fills with espresso.", "variants": "Variants: idle (outline), active (filled espresso), with count, active with count, with dropdown arrow, applied and removable (accent outline and a cross), Filter button (icon only). States: default, pressed, disabled.", "screens": "Home feed, Search and results, Catalog and filters, My orders, Own profile, Seller profile", "phase": "First flows", "note": "Composed from Pressable and Text. Single-choice sets can sit on Reusables Toggle Group."}, {"id": "badge", "name": "Badge", "tier": "C", "src": "R:Badge", "desc": "A tiny uppercase outlined pill with an icon that tells you a status or a quality.", "variants": "Variants: sold (success), reserved (warning), new, price drop, bumped, verified (accent), info such as frequent uploads (neutral), order status (in progress, completed, cancelled), removed. Always outline, icon and label. Text 10px tracked. Item cards use the same outline badge.", "screens": "Item page, Seller profile, Own profile, Home feed, My orders", "phase": "First flows", "note": ""}, {"id": "avatar", "name": "Avatar", "tier": "C", "src": "R:Avatar", "desc": "A round picture of a person, or their initial when there is no picture.", "variants": "Sizes: 24, 40, 52, 72. Variants: photo, initial, silhouette (no photo), with verified tick. Overlapping stack.", "screens": "Item page, Seller profile, Inbox, Conversation thread, Own profile, Profile menu", "phase": "First flows", "note": ""}, {"id": "tabs", "name": "Tabs", "tier": "C", "src": "R:Tabs", "desc": "Switches between views on one screen with a line under the active one.", "variants": "Variants: underline (equal widths, 2px accent line). 2 to 3 tabs. States: active, idle, pressed. Optional count.", "screens": "Inbox, Seller profile, Own profile, My orders, Search and results", "phase": "First flows", "note": ""}, {"id": "listrow", "name": "ListRow", "tier": "C", "src": "X", "desc": "A full-width tappable line with an icon, a label, an optional value and a chevron.", "variants": "Variants: navigation (chevron), with value, with leading icon, with switch, destructive. States: default, pressed, disabled. 54 to 62px tall.", "screens": "Settings, Profile menu, Catalog and filters, Balance, Category picker, Search and results", "phase": "First flows", "note": "Composed from Pressable, Icon and Text."}, {"id": "sectionheader", "name": "SectionHeader", "tier": "C", "src": "X", "desc": "A small uppercase label that titles a group of content, with an optional action on the right.", "variants": "Variants: label only, with action link, with count.", "screens": "Home feed, Settings, Balance, Sell form, Own profile", "phase": "First flows", "note": "Composed from Text."}, {"id": "topbar", "name": "TopBar", "tier": "C", "src": "X", "desc": "The bar at the top of a task page with a back arrow, a centred title and an optional action.", "variants": "Variants: back plus title, close plus title, title only (tab pages), with right action (text or icon), over photo (transparent).", "screens": "Item page, Conversation thread, Sell form, Settings, Favourites, Catalog and filters, My orders, Balance", "phase": "First flows", "note": "Composed from IconButton and Text. Sits inside Screen."}, {"id": "textlink", "name": "TextLink", "tier": "C", "src": "X", "desc": "Inline tappable text such as Learn more or How you are covered.", "variants": "Variants: accent underline, plain, with trailing icon. States: default, pressed.", "screens": "Item page, Conversation thread, Sell form, Own profile, Catalog and filters", "phase": "First flows", "note": "Composed from Pressable and Text."}, {"id": "starrating", "name": "StarRating", "tier": "C", "src": "X", "desc": "Five stars that show an average or one review score.", "variants": "Sizes: 12, 16, 32. Variants: display (part-filled last star), with count, large score. Gold is not in our palette, so stars use the accent colour.", "screens": "Item page, Seller profile, Own profile, Conversation thread", "phase": "First flows", "note": "Composed from Icon."}, {"id": "expandabletext", "name": "ExpandableText", "tier": "C", "src": "X", "desc": "A paragraph cut after a few lines with a more link that opens the rest.", "variants": "States: collapsed (3 lines), expanded.", "screens": "Item page", "phase": "First flows", "note": "Composed from Text and TextLink."}, {"id": "dialog", "name": "Dialog", "tier": "C", "src": "R:Alert Dialog", "desc": "A centred window for a quick yes or no decision.", "variants": "Variants: confirm (two actions), destructive confirm, info (one action). Backdrop dim. 20px radius.", "screens": "Sell form (save changes before closing), Item page", "phase": "First flows", "note": ""}, {"id": "bottomsheet", "name": "BottomSheet", "tier": "C", "src": "G", "desc": "A window that slides up from the bottom over a dimmed page. The base for filters, pickers, offers and price breakdown.", "variants": "Heights: content-sized, 88% tall. Header: title, optional back arrow, close. States: closed, open, dragging. 20px top corners, 300ms ease-out.", "screens": "Catalog and filters, Category picker, Item page, Sell form", "phase": "First flows", "note": "Gorhom Bottom Sheet with our header, fill and backdrop."}, {"id": "actionmenu", "name": "ActionMenu", "tier": "C", "src": "R:Dropdown Menu", "desc": "A small menu that opens from a more button, such as share or report.", "variants": "Item types: default, destructive, with icon. States: closed, open, pressed row.", "screens": "Item page, Seller profile, Own profile, Conversation thread", "phase": "First flows", "note": ""}, {"id": "collapsible", "name": "Collapsible", "tier": "C", "src": "R:Collapsible", "desc": "A header that opens and closes a section of content with a smooth height change.", "variants": "States: closed, open (rotating arrow). Content mounts on first open.", "screens": "Help (later), Sell form advanced details", "phase": "Later", "note": ""}, {"id": "skeleton", "name": "Skeleton", "tier": "C", "src": "R:Skeleton", "desc": "A soft grey placeholder shape shown while content loads, instead of a blank screen.", "variants": "Shapes: block, line, circle. Presets: card, row. Soft pulse, 700 to 1200ms.", "screens": "Home feed, Search and results, Item page, Inbox", "phase": "First flows", "note": ""}, {"id": "spinner", "name": "Spinner", "tier": "C", "src": "B", "desc": "A small turning ring for short waits.", "variants": "Sizes: 16, 20, 32. Colours: accent, on-accent (inside primary buttons). Holds at least one full cycle.", "screens": "Home feed (infinite scroll), Search and results, Button loading", "phase": "First flows", "note": "React Native ActivityIndicator."}, {"id": "progress", "name": "Progress", "tier": "C", "src": "R:Progress", "desc": "A thin bar that shows how far along something is.", "variants": "Determinate 0 to 100. Thin 4px.", "screens": "Profile menu (badges earned), Sell form (upload)", "phase": "Later", "note": ""}, {"id": "itemcard", "name": "ItemCard", "tier": "M", "src": "X", "desc": "The tile for one listing: tall rounded photo, brand, description, size and condition, and the price the buyer really pays.", "variants": "Variants: browse (default), favourited (filled heart), sold (washed photo, green Sold badge, struck price), bumped (Bumped badge), price drop (Price drop badge, sale price, struck Was price and percentage), own listing (price, views, favourites, Bump), loading (skeleton). States: default, pressed (scale 0.98).", "screens": "Home feed, Search and results, Seller profile, Favourites, Own profile", "phase": "First flows", "note": "Composed from Photo, HeartPill (circle variant), Text and PriceBlock. Badges are the standard outline badges."}, {"id": "heartpill", "name": "HeartPill", "tier": "M", "src": "X", "desc": "A small white pill with a heart and the number of people who saved the item.", "variants": "States: not saved (outline), saved (filled, red), pressed. With or without count. On photo or inline. Circle variant (heart only) sits top-right on item cards.", "screens": "Home feed, Search and results, Item page, Seller profile, Favourites", "phase": "First flows", "note": "Composed from Pressable, Icon and Text."}, {"id": "priceblock", "name": "PriceBlock", "tier": "M", "src": "X", "desc": "Shows the seller price and what the buyer pays, with the buyer protection shield, so fees are never a surprise.", "variants": "Sizes: card (small), item page (large), sticky bar. Variants: with protection line, seller price only (own listing), strikethrough old price (offer). Protection line opens the price breakdown.", "screens": "Home feed, Item page, Conversation thread, My orders, Search and results", "phase": "First flows", "note": "Composed from Text and Icon."}, {"id": "searchbar", "name": "SearchBar", "tier": "M", "src": "X", "desc": "The big rounded search box at the top of Home and Browse, with a camera for photo search.", "variants": "States: idle (tap opens search), focused, filled with clear, busy (Searching...). Camera icon on the right. 32px radius.", "screens": "Home feed, Browse, Search and results", "phase": "First flows", "note": "Composed from TextField styling, Icon and Pressable."}, {"id": "filterbar", "name": "FilterBar", "tier": "M", "src": "X", "desc": "The scrolling row of filter chips above search results, with Filter first and a result count underneath.", "variants": "Variants: Filter button (icon only) first, category chips (Home), status chips (My orders). Count row: 500+ results.", "screens": "Home feed, Search and results, My orders, Own profile", "phase": "First flows", "note": "A horizontal row of Chips with the results count."}, {"id": "categorytile", "name": "CategoryTile", "tier": "M", "src": "X", "desc": "A light tinted tile on the Browse grid: label top-left, picture bottom-right. Opens one main category.", "variants": "Variants: icon tile (a line icon stands in for the illustration, style to decide). States: default, pressed (scale 0.98). Long labels wrap to three lines.", "screens": "Browse", "phase": "First flows", "note": "Composed from Pressable, Icon and Text."}, {"id": "categorygrid", "name": "CategoryGrid", "tier": "M", "src": "X", "desc": "The body of the Browse tab: the search bar on top, then the main categories as a two-column grid of tiles.", "variants": "Nine main categories in 2 columns with 12px gaps. Scrolls. States: default, pressed tile, loading.", "screens": "Browse", "phase": "First flows", "note": "Composed from SearchBar and CategoryTile. The root screen of the Browse tab's stack."}, {"id": "categorypanel", "name": "CategoryPanel", "tier": "M", "src": "X", "desc": "One full-screen level of the category tree. It slides in from the trailing edge and pushes the screen before it aside, with the tab bar still showing Browse.", "variants": "Levels: main category (Men), sub level (Men, Clothing), deeper levels the same way. Top bar: back arrow, centred title, search icon. First row is All. Back reverses the motion.", "screens": "Browse", "phase": "First flows", "note": "Expo Router stack push (native slide) inside the Browse tab, not a custom drawer. Composed from TopBar and CategoryRow."}, {"id": "categoryrow", "name": "CategoryRow", "tier": "M", "src": "X", "desc": "One line in a category panel: an icon, a label and a chevron when it has children.", "variants": "Variants: branch (chevron, opens another panel), leaf (no chevron, opens the feed), All (grid icon, opens the feed for the whole level). States: default, pressed. Hairline between rows.", "screens": "Browse", "phase": "First flows", "note": "Composed from Pressable, Icon and Text. Looks like ListRow with a leading icon, kept separate so category rows stay uniform."}, {"id": "itemgrid", "name": "ItemGrid", "tier": "M", "src": "X", "desc": "The two-column feed of item cards with infinite scroll and a loading spinner at the end.", "variants": "Columns: 2 on phone, 3 on tablet. Footer: spinner, end of list. Empty and loading states.", "screens": "Home feed, Search and results, Seller profile, Favourites, Own profile", "phase": "First flows", "note": "Wraps FlatList with two columns."}, {"id": "bottomtabbar", "name": "BottomTabBar", "tier": "M", "src": "X", "desc": "The five tabs at the bottom: Home, Browse, Sell, Inbox, Profile.", "variants": "States per tab: idle (outline icon, muted label), active (accent icon and label), pressed. Inbox unread count pill. Hidden on task pages. Sits above the home indicator. Stays visible with Browse active while category panels push in.", "screens": "Home feed, Browse, Search and results, Inbox, Profile menu, Favourites, My orders", "phase": "First flows", "note": "Built on the Expo Router tab bar."}, {"id": "stickyactionbar", "name": "StickyActionBar", "tier": "M", "src": "X", "desc": "A bar fixed to the bottom of the item page with the price and the buy actions.", "variants": "Variants: buyer (Make an offer plus Buy now), your own item (Edit plus Mark as sold), sold (disabled with note), with protection link. Sits above the home indicator.", "screens": "Item page, Sell form (Upload), Catalog and filters (Show results)", "phase": "First flows", "note": "Composed from Button and PriceBlock."}, {"id": "banner", "name": "Banner", "tier": "M", "src": "X", "desc": "A rounded message strip that informs, warns or promotes.", "variants": "Tones: info, warning, promo, safety card (shield and link), notice strip (pinned above the tab bar). Dismissible cross. Optional action.", "screens": "Home feed, Conversation thread, Settings, Own profile, Item page", "phase": "First flows", "note": "Composed from Reusables Alert styling, Icon and Button."}, {"id": "emptystate", "name": "EmptyState", "tier": "M", "src": "X", "desc": "What a screen shows when there is nothing to show, and why.", "variants": "Reasons: no items yet, no results, no permission, error with retry, offline. Icon, title, one line of help, optional button.", "screens": "My orders, Inbox, Favourites, Search and results, Own profile", "phase": "First flows", "note": "Composed from Icon, Text and Button."}, {"id": "photocarousel", "name": "PhotoCarousel", "tier": "M", "src": "X", "desc": "The big swipeable photo at the top of the item page with page dots.", "variants": "Overlays: back and more buttons, heart pill, dots. States: loading, 1 photo (no dots), many photos. Sold overlay.", "screens": "Item page", "phase": "First flows", "note": "Composed from Photo with a paging scroll view. Reusables has no carousel."}, {"id": "sellerrow", "name": "SellerRow", "tier": "M", "src": "X", "desc": "Who is selling: avatar, name, stars and a button to ask them a question.", "variants": "Variants: item page (with Ask seller), compact (thread header), with seller badge. States: pressed.", "screens": "Item page, Conversation thread", "phase": "First flows", "note": "Composed from Avatar, StarRating, Badge and Button."}, {"id": "profileheader", "name": "ProfileHeader", "tier": "M", "src": "X", "desc": "The top of a member's profile with identity, trust details and the follow button.", "variants": "Variants: other member (Follow), own profile (Edit). States: following, not following. Verified rows, location, last seen.", "screens": "Seller profile, Own profile", "phase": "First flows", "note": "Composed from Avatar, StarRating, Badge, ListRow and Button."}, {"id": "reviewsummary", "name": "ReviewSummary", "tier": "M", "src": "X", "desc": "The big average score with stars and a count, and a split of reviews by source.", "variants": "Variants: with member and automatic split, member only. Empty (no reviews yet).", "screens": "Seller profile, Own profile", "phase": "First flows", "note": "Composed from StarRating and ListRow."}, {"id": "reviewrow", "name": "ReviewRow", "tier": "M", "src": "X", "desc": "One review: who wrote it, when, the stars and the text.", "variants": "Variants: member review, automatic review, with seller Reply. Translate link (later).", "screens": "Seller profile, Own profile", "phase": "First flows", "note": "Composed from Avatar, StarRating and Button."}, {"id": "conversationrow", "name": "ConversationRow", "tier": "M", "src": "X", "desc": "One line of the inbox: who, a preview, the time and a small thumbnail of the item.", "variants": "Variants: message, notification (thumbnail and up to 4 lines), system message (app avatar). States: read, unread (bold plus dot), pressed.", "screens": "Inbox, Notifications", "phase": "First flows", "note": "Composed from Avatar, Photo and Text."}, {"id": "itemstrip", "name": "ItemStrip", "tier": "M", "src": "X", "desc": "A thin row with an item thumbnail, its title and price, used to pin the item in a chat and to list orders.", "variants": "Variants: thread (pinned top), order row (status line, chevron, check badge when complete). States: pressed.", "screens": "Conversation thread, My orders", "phase": "First flows", "note": "Composed from Photo and PriceBlock."}, {"id": "messagebubble", "name": "MessageBubble", "tier": "M", "src": "X", "desc": "One chat message.", "variants": "Variants: theirs (white, thin border, left), yours (filled, right), intro card, photo message. States: sending, sent, failed.", "screens": "Conversation thread", "phase": "First flows", "note": "Composed from Text."}, {"id": "offerbubble", "name": "OfferBubble", "tier": "M", "src": "X", "desc": "A chat bubble that shows an offer: the new price, the old price struck through, and its status.", "variants": "Statuses: sent, accepted, declined, countered, expired. Buyer view: waiting. Seller view: Accept and Decline buttons.", "screens": "Conversation thread", "phase": "First flows", "note": "Composed from MessageBubble, PriceBlock and Badge."}, {"id": "ordertimeline", "name": "OrderTimeline", "tier": "M", "src": "X", "desc": "The story of an order as dated dividers: Sold, Order shipped, Delivered, then Sale complete with next steps.", "variants": "Steps: sold, shipped, delivered, complete. Variants: divider (in thread), full tracker (order page). States: done, current, upcoming.", "screens": "Conversation thread, My orders", "phase": "First flows", "note": "Composed from Text and Separator, shown inside the chat."}, {"id": "messagecomposer", "name": "MessageComposer", "tier": "M", "src": "X", "desc": "The box at the bottom of a chat where you type, attach a photo and send.", "variants": "States: empty (send greyed), typing (send active), with photo, disabled (order closed). Sits above the keyboard.", "screens": "Conversation thread", "phase": "First flows", "note": "Composed from TextField styling and IconButton."}, {"id": "filtersheet", "name": "FilterSheet", "tier": "M", "src": "G", "desc": "The page of filters: sort, category, size, brand, condition, colour and price, with one Show results button.", "variants": "Header: Close, Filter, Clear all. Rows show the current value. Sub-pages: price range, size list, brand list with search. Button shows live count.", "screens": "Search and results, Catalog and filters", "phase": "First flows", "note": "Gorhom Bottom Sheet (88%) holding ListRows, price fields and a sticky button."}, {"id": "optionlistsheet", "name": "OptionListSheet", "tier": "M", "src": "G", "desc": "A sheet with a flat list of options to pick from, such as size, brand, condition, colour or parcel size.", "variants": "Selection: single (radio), multiple (checkbox). Optional search field. Sticky Show results or Done button.", "screens": "Sell form, Catalog and filters", "phase": "First flows", "note": "Gorhom Bottom Sheet with a Checkbox or Radio list and optional search."}, {"id": "categorypicker", "name": "CategoryPicker", "tier": "M", "src": "G", "desc": "A sheet where you drill down through categories until you pick one leaf, with a search shortcut.", "variants": "Levels: top (Women, Men, Kids...), branch (chevron), leaf (radio). Header with back arrow and the current level name. Find a category search. Used where a sheet fits (Sell form, Filter page). The Browse tab uses CategoryPanel instead.", "screens": "Category picker, Sell form, Catalog and filters", "phase": "First flows", "note": "Gorhom Bottom Sheet with a drill-down list of ListRows and Radios."}, {"id": "photouploader", "name": "PhotoUploader", "tier": "M", "src": "X", "desc": "The row of photo tiles on the sell form where you add, remove and order your pictures.", "variants": "States: empty (large dashed box), adding (dashed plus tile), with photos (Main label on the first), uploading (progress), error. Up to 20 photos.", "screens": "Sell form", "phase": "First flows", "note": "Composed from Photo, IconButton and Expo Image Picker."}, {"id": "pickerrow", "name": "PickerRow", "tier": "M", "src": "X", "desc": "An outlined form row that opens a sheet. A plus means empty, a pencil means filled.", "variants": "States: empty (plus), filled (value and pencil), error, disabled (until category is chosen).", "screens": "Sell form", "phase": "First flows", "note": "Composed from ListRow with an outline."}, {"id": "pricebreakdown", "name": "PriceBreakdown", "tier": "M", "src": "X", "desc": "The sheet that explains what you pay: item price, buyer protection fee, postage and total.", "variants": "Variants: buyer view, seller view (what you earn). With info line about protection.", "screens": "Item page", "phase": "First flows", "note": "Content for BottomSheet."}, {"id": "offersheet", "name": "OfferSheet", "tier": "M", "src": "G", "desc": "The sheet to make an offer: type a price, see what the buyer would pay, and send.", "variants": "States: empty, valid, too low (error), sending. Suggested offers as chips.", "screens": "Item page", "phase": "First flows", "note": "Gorhom Bottom Sheet with a TextField, suggested prices and Button."}, {"id": "balanceheader", "name": "BalanceHeader", "tier": "M", "src": "X", "desc": "The top of the balance screen: pending amount, a large available amount and circle actions.", "variants": "States: zero balance (Withdraw greyed), with balance, pending hold. Actions: Withdraw, Shop.", "screens": "Balance", "phase": "Later", "note": "Composed from Text, IconButton and ListRow."}];

/* ---------- foundations */
const TYPE=[
['Hero / greeting','40 px, 300 light, emphasis 800. Tracking -0.035em, line height 0.96','t-display','Good <b>morning</b>, Maya'],
['Page title','32 px, 700','t-title','Your inbox'],
['Page subtitle','14 px, 400, secondary','t-subtitle','Messages from buyers and sellers'],
['Item name (large)','28 px, 800','t-itemname','Cream knit poncho'],
['Sheet / list heading','18 px, 700','t-heading','Price breakdown'],
['Section header','12 px, 600, uppercase, tracked','t-section','Fresh finds'],
['Small label','10 px, 500, uppercase, 0.12em','t-label','Your offer'],
['Card title','13 px, 500','t-cardtitle','Carhartt'],
['Card subtitle','11 px, 400, uppercase, muted','t-cardsub','L · Good'],
['Filter pill','13 px, 500','t-pill','Women'],
['Badge','10 px, 600, 0.08em','t-badge','Sold'],
['Body','16 px, 400 (inputs 16)','t-body','Soft cream knit with fringe, worn twice.'],

const COLS=[
['Surfaces',[['background','#FFFFFF','Page background','17.30:1 text-1 on it'],['surface','#FBF8F2','Raised: search bar, cards','6.24:1 text-3 on it'],['pressed','#F1E9DA','Pressed surface, switch track off',''],['border','#E4DACA','Border default',''],['border-subtle','#F0EADF','Dividers, chip outline','']]],
['Text ladder',[['text-1','#241811','Primary text','17.30:1 on background'],['text-2','#54443A','Secondary text','9.27:1 on background'],['text-3','#695A4F','Muted text','6.61:1 on background'],['text-4','#7A6B60','Faint text','5.12:1 on background']]],
['Accent',[['accent','#4B2E22','Primary fill, links, prices, active tab','12.26:1 on background'],['on-accent','#FFFFFF','Text on accent fill','12.26:1 on accent'],['accent-tint','#F7EEDC','Info banners, New badge','10.63:1 accent on it'],['chip-selected','#EFE0C3','Promo banner fill','11.34:1 on-chip on it'],['on-chip','#3A2218','Promo banner label','']]],
['State',[['success','#1B7A43','Sold ribbon, success','5.37:1 on background'],['success-tint','#E6F4EA','Success background','4.73:1 success on it'],['warning','#8A4F00','Warning text','5.74:1 on warning-tint'],['warning-tint','#FFEFC2','Warning background',''],['error','#B3261E','Error text and outline','6.54:1 on background'],['error-tint','#FDECEA','Error background','5.72:1 error on it'],['destructive','#B3261E','Destructive actions','same as error']]],
['Window',[['window','#FFFFFF','White at 96 percent, sheet fill (derived)',''],['backdrop','#241811','Text-1 at 25 percent, dim (derived)','']]]];
const CT=[['Primary text on page','#241811','#FFFFFF','17.30:1','4.5:1'],['Secondary text on page','#54443A','#FFFFFF','9.27:1','4.5:1'],['Muted text on page','#695A4F','#FFFFFF','6.61:1','4.5:1'],['Faint text on page','#7A6B60','#FFFFFF','5.12:1','4.5:1'],['Muted text on raised surface','#695A4F','#FBF8F2','6.24:1','4.5:1'],['Faint text on raised surface','#7A6B60','#FBF8F2','4.83:1','4.5:1'],['Primary button label','#FFFFFF','#4B2E22','12.26:1','4.5:1'],['Price line, links, outline button','#4B2E22','#FFFFFF','12.26:1','4.5:1'],['Active tab icon and label','#4B2E22','#FFFFFF','12.26:1','4.5:1'],['Price line on raised surface','#4B2E22','#FBF8F2','11.56:1','4.5:1'],['Accent on tint (banner, badge)','#4B2E22','#F7EEDC','10.63:1','4.5:1'],['Promo banner label','#3A2218','#EFE0C3','11.34:1','4.5:1'],['Inactive chip outline (3:1 for borders)','#7A6B60','#FFFFFF','5.12:1','3:1'],['Active chip label','#FFFFFF','#4B2E22','12.26:1','4.5:1'],['Warning badge on white','#8A4F00','#FFFFFF','6.56:1','4.5:1'],['Sold ribbon label','#FFFFFF','#1B7A43','5.37:1','4.5:1'],['Success text on page','#1B7A43','#FFFFFF','5.37:1','4.5:1'],['Success on success tint','#1B7A43','#E6F4EA','4.73:1','4.5:1'],['Warning text on warning tint','#8A4F00','#FFEFC2','5.74:1','4.5:1'],['Error text on page','#B3261E','#FFFFFF','6.54:1','4.5:1'],['Error on error tint','#B3261E','#FDECEA','5.72:1','4.5:1'],['Switch on, primary fill (icons)','#4B2E22','#FFFFFF','12.26:1','3:1']];
function foundations(){
 const sw=x=>`<div class="sw"><div class="c" style="background:${x[0]==='window'?'linear-gradient(135deg,#fff,#EFE0C3)':x[0]==='backdrop'?'rgba(36,24,17,.25)':x[1]};color:${['background','surface','pressed','border','border-subtle','accent-tint','chip-selected','success-tint','warning-tint','error-tint','window'].includes(x[0])?'#241811':'#fff'}">${x[3]?'Aa':'Aa'}</div><div class="d"><b>${x[0]}</b><code>${x[0]==='window'?'#FFFFFF 96%':x[0]==='backdrop'?'#241811 25%':x[1]}</code><span>${x[2]}</span>${x[3]?`<span style="color:var(--success);font-weight:600">${x[3]}</span>`:''}</div></div>`;
 return `<div class="eyebrow">Foundations</div><h1 class="sname">Espresso <b>and cream</b></h1><p class="lead-p">Every component on this sheet is drawn in the chosen palette (D-006), with Aileron and Kept's look: hairline borders, no shadows, fully rounded pills, 12px buttons, 20px windows, 8px grid. Pick a component on the left to see every variant and state.</p>
 <div class="hl"><div><b>${META.length}</b><span>Components</span></div><div><b>${META.filter(m=>m.tier==='F').length} / ${META.filter(m=>m.tier==='C').length} / ${META.filter(m=>m.tier==='M').length}</b><span>Foundation, Core, Patterns</span></div><div><b>23</b><span>Colour tokens</span></div><div><b>${Object.keys(ICONS).length}</b><span>Icons in use</span></div></div>
 ${sh('Colour tokens')}${COLS.map(g=>`<div class="eyebrow" style="margin:16px 0 8px">${g[0]}</div><div class="sws">${g[1].map(sw).join('')}</div>`).join('')}
 ${sh('Measured contrast')}<div class="tw"><table class="ct"><thead><tr><th>Pair</th><th>Colours</th><th>Measured</th><th>Needs</th><th></th></tr></thead><tbody>${CT.map(r=>`<tr><td>${r[0]}</td><td style="white-space:nowrap"><span class="dot" style="background:${r[1]}"></span>${r[1]} <span class="dot" style="background:${r[2]};margin-left:6px"></span>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td class="pass">Pass</td></tr>`).join('')}</tbody></table></div><p class="fnote">WCAG formula, copied from the mockup's computed table (colour-options-2, option 4). Text needs 4.5:1, icons and large text 3:1. The tightest text pair is faint text on the raised surface at 4.83:1.</p>
 ${sh('Type scale (Aileron)')}<div class="tw tscale">${TYPE.map(x=>`<div class="r"><div class="m"><b>${x[0]}</b>${x[1]}</div><div class="${x[2]}">${x[3]}</div></div>`).join('')}</div><p class="fnote">Aileron is loaded in weights 300, 400, 600, 700 and 800. Weights 200 and 500 do not exist in this font package, so the browser shows 200 as 300 and 500 as 400. Worth deciding before the app loads the font files (see the notes in the build report).</p>
 ${sh('Spacing (8px grid)')}<div class="tw spc">${[['xs',4,'Icon to text, tiny separators'],['sm',8,'Between pills, badge to edge'],['md',12,'Grid gap, card padding'],['lg',16,'Between sections, page side padding'],['xl',24,'Between major sections'],['2xl',40,'Page top padding, large breaks']].map(x=>`<div class="r"><b>${x[0]}</b><code>${x[1]}px</code><i class="bar" style="width:${x[1]*3}px"></i><span class="u">${x[2]}</span></div>`).join('')}</div>
 ${sh('Radii and borders')}<div class="rad">${[['Button',12,'12px'],['Window',20,'20px, sheets on the top corners'],['Search bar',32,'32px'],['Pill',999,'Fully rounded: chips, badges']].map(x=>`<div class="b"><i style="border-radius:${x[1]}px"></i><b>${x[0]}</b><span>${x[2]}</span></div>`).join('')}<div class="b"><i style="border-radius:12px;border:.5px solid var(--border)"></i><b>Hairline</b><span>0.5 to 1px, no shadows</span></div></div>
 ${sh('Icons (Lucide, outline)')}<div class="icons">${Object.keys(ICONS).sort().map(n=>`<div>${I(n,24)}${n}</div>`).join('')}</div><p class="fnote">Lucide, stroke 1.75, drawn in the text colour. The paths come from lucide-static on cdn.jsdelivr.net and are embedded in this page, so icons still show when the viewer blocks outside content.</p>`}
function story(m){
 const body=(R[m.id]?R[m.id]():'<p class="note">No preview yet.</p>');
 const srcLabel=({R:m.src.startsWith('R:')?'Reusables: '+m.src.slice(2):'',G:'Gorhom Bottom Sheet',X:'Custom',B:'Expo / RN built-in'})[m.src[0]];
 return `<div class="eyebrow">${TIERN[m.tier]}</div><h1 class="sname">${m.name}</h1><p class="purpose">${m.desc}</p>
 <div class="tags"><span class="tag src-${m.src[0]}">${srcLabel}</span><span class="tag">${m.phase}</span></div>
 <dl class="facts"><dt>Variants</dt><dd>${m.variants}</dd><dt>Used on</dt><dd>${m.screens}</dd>${m.note?`<dt>Built from</dt><dd>${m.note}</dd>`:''}</dl>${body}`}
/* ---------- shell */
const nav=document.getElementById('nav'),page=document.getElementById('page'),q=document.getElementById('q');
document.getElementById('sicon').innerHTML=I('search',16);
function buildNav(){
 const f=q.value.trim().toLowerCase();
 let h=`<a href="#/foundations" class="${cur==='foundations'?'on':''}"${!f||'foundations colour type spacing radii icons'.includes(f)?'':' style="display:none"'}>Foundations</a>`;
 let any=!f||'foundations colour type spacing radii icons'.includes(f);
 for(const t of ['F','C','M']){
  const l=META.filter(m=>m.tier===t&&(!f||(m.name+' '+m.desc+' '+m.src+' '+m.screens).toLowerCase().includes(f)));
  if(!l.length)continue;any=true;
  h+=`<h6><span>${TIERN[t]}</span><span>${l.length}</span></h6>`+l.map(m=>`<a href="#/${m.id}" class="${cur===m.id?'on':''}">${m.name}${m.phase==='Later'?'<span class="later">Later</span>':''}</a>`).join('');
 }
 nav.innerHTML=h+(any?'':'<div class="nonav">No components match.</div>');
}
let cur='foundations';
function route(){
 cur=(location.hash.replace('#/','')||'foundations');
 const m=META.find(x=>x.id===cur);
 if(!m)cur='foundations';
 page.innerHTML=cur==='foundations'?foundations():story(m);
 document.getElementById('mlabel').textContent=cur==='foundations'?'Foundations':m.name;
 document.title=(cur==='foundations'?'Foundations':m.name)+' | VintyShminty component sheet';
 document.body.classList.remove('menu');buildNav();window.scrollTo(0,0);
}
addEventListener('hashchange',route);q.addEventListener('input',buildNav);
document.getElementById('mbtn').onclick=()=>document.body.classList.toggle('menu');
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tog]');if(t){t.classList.toggle('on');return}
 const o=e.target.closest('[data-one]');if(o){const g=o.closest('[data-group]');if(g){g.querySelectorAll('[data-one]').forEach(x=>x.classList.remove('on'));o.classList.add('on')}}
});
route();
</script></body></html>
