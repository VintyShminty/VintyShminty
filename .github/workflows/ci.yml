name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  audit:
    runs-on: ubuntu-latest
    # Blocks the pull request on any high or critical finding. Accepted findings live in
    # pnpm-workspace.yaml under auditConfig.ignoreGhsas, each with a reason and a recheck date.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod

  semgrep:
    runs-on: ubuntu-latest
    # Code scanning with open source Semgrep (no account, no token, nothing leaves the runner).
    # Blocks the pull request on any finding at severity ERROR. WARNING and INFO are listed in the
    # job summary and never fail the job. Ignored paths are in .semgrepignore.
    # Image: semgrep/semgrep 1.179.0, pinned by digest. Update the digest and this comment together.
    container:
      image: semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b # 1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Excluded rules, each with a reason:
      # - npm-missing-minimum-release-age: asks for an npm setting, but we install with pnpm, which has
      #   minimumReleaseAge in pnpm-workspace.yaml (7 days).
      # - pnpm-trust-policy: trustPolicy no-downgrade makes the install fail today because many Expo
      #   packages are flagged. Recheck when Expo publishes with provenance (see the playbook).
      - name: Scan
        run: >
          semgrep scan --metrics=off
          --config p/default --config p/typescript --config p/react --config p/nodejs
          --config p/expressjs --config p/secrets --config p/sql-injection --config p/jwt
          --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age
          --exclude-rule package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy
          --json-output=semgrep.json
      - name: Summary and gate
        run: python3 .github/scripts/semgrep-summary.py semgrep.json "$GITHUB_STEP_SUMMARY"
